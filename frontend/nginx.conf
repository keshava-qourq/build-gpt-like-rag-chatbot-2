server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets with content-hashed names are safe to cache long; the
    # HTML entrypoint below is not, so a redeploy is picked up on refresh.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback: any unknown path (a client-side route such as /chat,
    # /library, /members) resolves to index.html rather than 404ing, so a
    # refresh behind the load balancer on any screen still loads the app
    # and lets react-router take over from there.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
